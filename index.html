<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14262e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Refinería">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Ruta de Estudio Refinería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: una columna de lectura (760px) con barra de bloques fija arriba; cada semana es una fila marcable, como una lista de verificación de planta. */
:root{
  --bg:#eef1f2; --surface:#ffffff; --ink:#14262e; --muted:#566b74; --line:#cfd8dc;
  --accent:#b8590f; --accent-soft:#f6e6d6; --done:#1c7a6b; --done-soft:#dcefeb; --warn:#a33a2b;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1b20; --surface:#17272e; --ink:#e6eef0; --muted:#9ab0b8; --line:#2c424b;
    --accent:#f0a35a; --accent-soft:#3a2a1a; --done:#55c2ae; --done-soft:#173832; --warn:#f08a78;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1b20; --surface:#17272e; --ink:#e6eef0; --muted:#9ab0b8; --line:#2c424b;
  --accent:#f0a35a; --accent-soft:#3a2a1a; --done:#55c2ae; --done-soft:#173832; --warn:#f08a78;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1;letter-spacing:.01em}
h1{font-size:30px;font-weight:700;text-transform:uppercase}
h2{font-size:26px;font-weight:600}
h3{font-size:20px;font-weight:600;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
p{margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{padding:20px 0 12px}
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.sync{font-size:12px;font-family:var(--mono);padding:4px 8px;border:1px solid var(--line);border-radius:4px;color:var(--muted);white-space:nowrap}
.sync.ok{color:var(--done);border-color:var(--done)}
.sync.off{color:var(--warn);border-color:var(--warn)}
/* barra global segmentada por bloque */
.global{margin-top:14px}
.gnums{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted)}
.gnums b{font-family:var(--display);font-size:34px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.segs{display:flex;gap:3px;margin-top:6px}
.seg{height:12px;background:var(--line);border-radius:2px;overflow:hidden;position:relative}
.seg i{position:absolute;inset:0 auto 0 0;background:var(--done);width:0;transition:width .25s}
.seglabels{display:flex;gap:3px;margin-top:4px;font-family:var(--mono);font-size:11px;color:var(--muted)}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:4px;overflow-x:auto;padding:8px 0}
.tab{flex:0 0 auto;font-family:var(--display);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:4px;border:1px solid transparent}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tab:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:20px 0 64px;display:flex;flex-direction:column;gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.next{border-left:5px solid var(--accent)}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.btn{display:inline-block;font-family:var(--display);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:var(--accent);color:var(--surface);border:0;border-radius:4px;padding:9px 14px;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
label.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=date]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.pace{font-size:15px}
.pace b{color:var(--ink)}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
a.bcard{text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px}
.bcard .tag{font-family:var(--mono);font-size:12px;color:var(--muted)}
.bcard .name{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.1}
.bar{height:8px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:3px;background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--done-soft);color:var(--done)}
.mix{display:flex;height:28px;border-radius:4px;overflow:hidden;font-family:var(--mono);font-size:12px}
.mix span{display:flex;align-items:center;justify-content:center;color:var(--surface)}
.mix .a{width:60%;background:var(--ink)} .mix .b{width:25%;background:var(--muted)} .mix .c{width:15%;background:var(--accent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.books{color:var(--muted);font-size:15px}
/* filas de semana */
.weeks{display:flex;flex-direction:column}
.week{display:grid;grid-template-columns:auto auto 1fr;gap:4px 12px;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.week:first-child{border-top:0}
.week input,.check input{width:22px;height:22px;accent-color:var(--done);margin:2px 0 0;cursor:pointer}
.wk{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:3px;min-width:28px}
.wbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.wtitle{font-weight:600;font-size:17px}
.wstudy{font-size:15px;color:var(--muted)}
.wprob{font-size:15px;border-left:3px solid var(--accent);padding-left:10px}
.wprob small{display:block;font-family:var(--mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.week.on .wtitle{color:var(--done)}
.week.on .wk{color:var(--done)}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:6px 0}
.check.on span{color:var(--done)}
.deliv{border:2px solid var(--accent)}
.deliv.on{border-color:var(--done);background:var(--done-soft)}
h4{font-family:var(--display);font-size:19px;font-weight:600;margin:6px 0 0;line-height:1.15}
ol.plain{padding-left:22px}
.defs{display:flex;flex-direction:column}
.def{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.def:first-child{border-top:0}
.dn{font-weight:600}
.dv{font-family:var(--mono);font-size:13px;color:var(--accent);text-align:right;max-width:150px}
.dw{grid-column:1 / -1;font-size:15px;color:var(--muted)}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.check b{font-weight:600}
textarea{width:100%;min-height:110px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px;resize:vertical}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){.seg i,.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="topline">
      <div>
        <h1>Ruta de Estudio Refinería</h1>
        <p class="sub">Ingeniería química para procesos de refinación: 4 bloques, 36 semanas, la unidad de crudo como hilo conductor.</p>
      </div>
      <span id="sync" class="sync">Cargando</span>
    </div>
    <div class="global">
      <div class="gnums"><span><b id="gdone">0</b> de <span id="gtotal">40</span> hitos</span><span id="gpct">0 %</span></div>
      <div class="segs" id="segs"></div>
      <div class="seglabels" id="seglabels"></div>
    </div>
  </header>
</div>
<nav class="tabs" aria-label="Bloques"><div class="wrap"><div class="tabrow" id="tabs"></div></div></nav>
<div class="wrap"><main id="main"></main></div>

var LS_KEY = "ruta-refineria-v1";
var state = {done:{}, notes:{}, start:""};

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function clean(o){
  var s = {done:{}, notes:{}, start:""};
  if(o && typeof o === "object"){
    if(o.done && typeof o.done === "object") for(var k in o.done) if(o.done[k] === true) s.done[k] = true;
    if(o.notes && typeof o.notes === "object") for(var n in o.notes) if(typeof o.notes[n] === "string" && o.notes[n]) s.notes[n] = o.notes[n].slice(0,20000);
    if(typeof o.start === "string" && /^\d{4}-\d{2}-\d{2}$/.test(o.start)) s.start = o.start;
  }
  return s;
}
function loadLocal(){try{var r = localStorage.getItem(LS_KEY); if(r) state = clean(JSON.parse(r));}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS_KEY, JSON.stringify(state));}catch(e){}}

/* ---------- progreso ---------- */
function milestones(b){var ids=[]; for(var i=0;i<b.weeks.length;i++) ids.push(b.id+"w"+(i+1)); ids.push(b.id+"e"); return ids;}
function blockStats(b){var ids=milestones(b), d=0; for(var i=0;i<ids.length;i++) if(state.done[ids[i]]) d++; return {done:d,total:ids.length};}
function allStats(){var d=0,t=0; BLOCKS.forEach(function(b){var s=blockStats(b); d+=s.done; t+=s.total;}); return {done:d,total:t};}
function weeksDone(){var d=0; BLOCKS.forEach(function(b){for(var i=1;i<=b.weeks.length;i++) if(state.done[b.id+"w"+i]) d++;}); return d;}
function totalWeeks(){var t=0; BLOCKS.forEach(function(b){t+=b.weeks.length;}); return t;}
function nextStep(){
  for(var i=0;i<BLOCKS.length;i++){var b=BLOCKS[i];
    for(var w=0;w<b.weeks.length;w++) if(!state.done[b.id+"w"+(w+1)]) return {b:b,w:w};
    if(!state.done[b.id+"e"]) return {b:b,w:-1};
  }
  return null;
}
function pace(){
  if(!state.start) return null;
  var p = state.start.split("-"), s = new Date(+p[0], +p[1]-1, +p[2]), now = new Date();
  var days = Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate()) - s)/86400000);
  if(days < 0) return {before:true, days:-days};
  var planned = Math.min(totalWeeks(), Math.floor(days/7)+1);
  return {planned:planned, diff:weeksDone() - (planned-1)};
}

function refreshStats(){
  var a = allStats();

  document.getElementById("gtotal").textContent = a.total;
  document.getElementById("gpct").textContent = Math.round(100*a.done/a.total) + " %";
  BLOCKS.forEach(function(b){
    var s = blockStats(b), pct = (100*s.done/s.total) + "%";
    var el = document.getElementById("seg-"+b.id); if(el) el.style.width = pct;
    var bar = document.getElementById("bar-"+b.id); if(bar) bar.style.width = pct;

function paceText(pc){
  if(!pc) return "Pon tu fecha de inicio para comparar tu avance con el calendario de 36 semanas.";
  if(pc.before) return "El plan empieza en <b>"+pc.days+" día"+(pc.days===1?"":"s")+"</b>.";
  var t = "Por calendario vas en la <b>semana "+pc.planned+" de "+totalWeeks()+"</b>. ";
  if(pc.diff > 0) t += "Llevas <b>"+pc.diff+" semana"+(pc.diff===1?"":"s")+" de ventaja</b>.";
  else if(pc.diff < 0) t += "Tienes <b>"+(-pc.diff)+" semana"+(pc.diff===-1?"":"s")+" de atraso</b>.";
  else t += "Vas <b>al día</b>.";
  return t;
}

  h += renderExtras(b);
  var eid = b.id+"e", eon = state.done[eid];
  h += '<section class="card deliv stack'+(eon?' on':'')+'" id="deliv-'+b.id+'"><h3>Entregable</h3><label class="check'+(eon?' on':'')+'" for="c-'+eid+'"><input type="checkbox" id="c-'+eid+'" data-id="'+eid+'"'+(eon?' checked':'')+'><span>'+esc(b.deliv)+'</span></label></section>';
  h += '<section class="card stack"><h3>'+esc(b.checkTitle)+'</h3><div>';
  b.checks.forEach(function(q,i){
    var id = b.id+"q"+(i+1), on = state.done[id];
    h += '<label class="check'+(on?' on':'')+'" for="c-'+id+'"><input type="checkbox" id="c-'+id+'" data-id="'+id+'"'+(on?' checked':'')+'><span>'+esc(q)+'</span></label>';
  });
  h += '</div></section>';
  h += '<section class="card stack"><h3>Notas del bloque</h3><label class="field" for="notes-'+b.id+'">Dudas, resultados y referencias<textarea id="notes-'+b.id+'" data-notes="'+b.id+'" placeholder="Por ejemplo: ΔP calculada 2,1 bar; el simulador da 2,3 bar.">'+esc(state.notes[b.id]||"")+'</textarea></label></section>';
  var prev = b.n > 1 ? '<a class="btn ghost" href="#bloque-'+(b.n-1)+'">Bloque '+(b.n-1)+'</a>' : '<a class="btn ghost" href="#resumen">Resumen</a>';
  var next = b.n < BLOCKS.length ? '<a class="btn ghost" href="#bloque-'+(b.n+1)+'">Bloque '+(b.n+1)+'</a>' : '<a class="btn ghost" href="#resumen">Resumen</a>';
  h += '<div class="foot">'+prev+next+'</div>';
  return h;
}
function render(){
  var m = /^bloque-([1-4])$/.exec(view), main = document.getElementById("main");
  main.innerHTML = m ? renderBlock(BLOCKS[+m[1]-1]) : renderResumen();
  var tabs = document.querySelectorAll(".tab");
  for(var i=0;i<tabs.length;i++){
    if(tabs[i].getAttribute("data-v") === view) tabs[i].setAttribute("aria-current","page");
    else tabs[i].removeAttribute("aria-current");
  }
  refreshStats();
}
function route(){
  var hsh = (location.hash||"").replace(/^#/,"");
  var nv = /^bloque-[1-4]$/.test(hsh) ? hsh : "resumen";
  var changed = nv !== view;
  view = nv; render();
  if(changed) window.scrollTo(0,0);
}

/* ---------- eventos ---------- */
document.addEventListener("change", function(e){
  var t = e.target;
  if(t.matches && t.matches("input[type=checkbox][data-id]")){
    var id = t.getAttribute("data-id");
    if(t.checked) state.done[id] = true; else delete state.done[id];
    var lab = t.closest("label"); if(lab) lab.classList.toggle("on", t.checked);
    var dv = t.closest(".deliv"); if(dv) dv.classList.toggle("on", t.checked);
    refreshStats(); changedState();
  } else if(t.id === "start"){
    state.start = /^\d{4}-\d{2}-\d{2}$/.test(t.value) ? t.value : "";
    var p = document.getElementById("pace"); if(p) p.innerHTML = paceText(pace());
    changedState();
  }
});
document.addEventListener("input", function(e){
  var t = e.target, b = t.getAttribute && t.getAttribute("data-notes");
  if(b){ if(t.value) state.notes[b] = t.value; else delete state.notes[b]; changedState(); }
});
window.addEventListener("hashchange", route);

/* ---------- guardado local y copia de seguridad ---------- */
function setSync(text, cls){var el = document.getElementById("sync"); el.textContent = text; el.className = "sync" + (cls ? " "+cls : "");}
function changedState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); setSync("Guardado","ok"); }
  catch(e){ setSync("No se pudo guardar","off"); }
}
function backupMsg(t){var el = document.getElementById("backupmsg"); if(el) el.textContent = t;}
document.addEventListener("click", function(e){
  var t = e.target;
  if(t && t.id === "export"){
    var data = JSON.stringify({app:"ruta-refineria", version:1, exported:new Date().toISOString(), state:state}, null, 2);
    var file = "ruta-refineria-" + new Date().toISOString().slice(0,10) + ".json";
    try{
      var f = new File([data], file, {type:"application/json"});
      if(navigator.canShare && navigator.canShare({files:[f]})){
        navigator.share({files:[f], title:"Avance Ruta de Estudio Refinería"}).then(function(){backupMsg("Copia exportada.");}, function(){});
        return;
      }
    }catch(err){}
    var url = URL.createObjectURL(new Blob([data], {type:"application/json"}));
    var a = document.createElement("a"); a.href = url; a.download = file; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);}, 2000);
    backupMsg("Copia exportada como " + file + ".");
  }
});
document.addEventListener("change", function(e){
  var t = e.target;
  if(t && t.id === "import" && t.files && t.files[0]){
    var r = new FileReader();
    r.onload = function(){
      try{
        var o = JSON.parse(r.result);
        if(!o || o.app !== "ruta-refineria" || !o.state) throw new Error("formato");
        state = clean(o.state); changedState(); render();
        backupMsg("Avance importado.");
      }catch(err){ backupMsg("Ese archivo no es una copia de esta app. Elige un archivo exportado desde aquí."); }
    };
    r.onerror = function(){ backupMsg("No se pudo leer el archivo. Inténtalo de nuevo."); };
    r.readAsText(t.files[0]);
    t.value = "";
  }
});

loadLocal();
renderChrome();
route();
setSync("Guardado en este dispositivo","ok");
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
</body>
</html>
